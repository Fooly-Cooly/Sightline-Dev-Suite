name: Sync Docs to GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Docs to GitHub Wiki
        uses: Andrew-Chen-De-Liang/github-wiki-action@v1.0.8
        with:
          path: docs
          token: ${{ secrets.GITHUB_TOKEN }}
